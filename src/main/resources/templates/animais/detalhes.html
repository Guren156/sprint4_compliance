<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:replace="~{layout/base :: head}">
    <title>Detalhes do Animal - ClyvoPet</title>
</head>
<body>
<div th:replace="~{layout/base :: layout(~{::page})}">
    <div th:fragment="page">
        <!-- Título centralizado -->
        <div style="text-align: center !important; margin-bottom: 0.5rem !important;">
            <h1 style="font-size: 1.75rem; font-weight: 700; color: #1e293b; margin: 0;">
                <i class="fas fa-paw me-2" style="color: #1e3a8a;"></i>Detalhes do Animal
            </h1>
        </div>

        <!-- Botão Voltar centralizado -->
        <div style="text-align: center !important; margin-bottom: 1.5rem !important;">
            <a href="/web/animais" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-2"></i>Voltar
            </a>
        </div>

        <!-- Card com detalhes -->
        <div class="card">
            <div class="card-body">
                <!-- Tabela de dados -->
                <div style="overflow-x: auto;">
                    <table class="table table-bordered" style="margin-bottom: 0;">
                        <tbody>
                        <tr>
                            <th style="width: 30%; background-color: #f8f9fa; font-weight: 600;">ID</th>
                            <td th:text="${animal.id}"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Nome</th>
                            <td th:text="${animal.nome}"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Espécie</th>
                            <td th:text="${animal.especie}"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Raça</th>
                            <td th:text="${animal.raca}"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Idade</th>
                            <td th:text="${animal.idade} + ' anos'"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Peso</th>
                            <td th:text="${animal.peso} + ' kg'"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Sexo</th>
                            <td th:text="${animal.sexo == 'M' ? 'Macho' : 'Fêmea'}"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Tutor</th>
                            <td th:text="${animal.tutorNome}"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Telefone do Tutor</th>
                            <td th:text="${animal.tutorTelefone}"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">E-mail do Tutor</th>
                            <td th:text="${animal.tutorEmail}"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Data de Cadastro</th>
                            <td th:text="${#temporals.format(animal.dataCadastro, 'dd/MM/yyyy HH:mm')}"></td>
                        </tr>
                        <tr>
                            <th style="background-color: #f8f9fa; font-weight: 600;">Observações</th>
                            <td th:text="${animal.observacoes}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Botões de ação -->
                <div style="display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;">
                    <a th:href="@{/web/animais/{id}/editar(id=${animal.id})}" class="btn btn-outline-warning">
                        <i class="fas fa-edit me-2"></i>Editar
                    </a>
                    <form th:action="@{/web/animais/{id}/delete(id=${animal.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-outline-danger" onclick="return confirm('Deletar?')">
                            <i class="fas fa-trash me-2"></i>Deletar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

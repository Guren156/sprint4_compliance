<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head th:replace="~{layout/base :: head}">
    <title>Detalhes da Consulta - ClyvoPet</title>
</head>

<body>

<div th:replace="~{layout/base :: layout(~{::page})}">

    <div th:fragment="page">

        <!-- Título -->
        <div style="text-align: center !important; margin-bottom: 1.5rem !important;">

            <h1 style="
                font-size: 1.75rem;
                font-weight: 700;
                color: #1e293b;
                margin: 0;">

                <i class="fas fa-calendar-check me-2"
                   style="color: #1e3a8a;"></i>

                Detalhes da Consulta

            </h1>

        </div>

        <!-- Card -->
        <div class="card shadow-sm">

            <div class="card-body">

                <!-- Tabela de informações -->
                <div class="table-responsive">

                    <table class="table table-bordered align-middle mb-0">

                        <tbody>

                        <!-- ID -->
                        <tr>
                            <th style="width: 25%; background-color: #f8fafc;">
                                <i class="fas fa-hashtag me-2 text-secondary"></i>
                                ID
                            </th>

                            <td th:text="${consulta.id}">
                                -
                            </td>
                        </tr>

                        <!-- Animal -->
                        <tr>
                            <th style="background-color: #f8fafc;">
                                <i class="fas fa-paw me-2 text-primary"></i>
                                Animal
                            </th>

                            <td th:text="${consulta.animalNome != null
                                ? consulta.animalNome
                                : '-'}">
                                -
                            </td>
                        </tr>

                        <!-- Veterinário -->
                        <tr>
                            <th style="background-color: #f8fafc;">
                                <i class="fas fa-user-md me-2 text-primary"></i>
                                Veterinário
                            </th>

                            <td th:text="${consulta.veterinarioNome != null
                                ? consulta.veterinarioNome
                                : '-'}">
                                -
                            </td>
                        </tr>

                        <!-- Data e Hora -->
                        <tr>
                            <th style="background-color: #f8fafc;">
                                <i class="fas fa-calendar-alt me-2 text-primary"></i>
                                Data e Hora
                            </th>

                            <td th:text="${consulta.dataHora != null
                                ? #temporals.format(
                                    consulta.dataHora,
                                    'dd/MM/yyyy HH:mm'
                                  )
                                : '-'}">
                                -
                            </td>
                        </tr>

                        <!-- Status -->
                        <tr>
                            <th style="background-color: #f8fafc;">
                                <i class="fas fa-info-circle me-2 text-primary"></i>
                                Status
                            </th>

                            <td>

                                <span
                                        th:class="${consulta.status == 'AGENDADA'
                                        ? 'badge bg-warning'
                                        : consulta.status == 'REALIZADA'
                                            ? 'badge bg-success'
                                            : 'badge bg-danger'}"

                                        style="
                                        font-size: 0.8rem;
                                        padding: 0.4rem 0.8rem;">

                                    <i
                                            th:class="${consulta.status == 'AGENDADA'
                                            ? 'fas fa-clock'
                                            : consulta.status == 'REALIZADA'
                                                ? 'fas fa-check-circle'
                                                : 'fas fa-times-circle'}"

                                            style="margin-right: 4px;">
                                    </i>

                                    <span th:text="${consulta.status}">
                                        -
                                    </span>

                                </span>

                            </td>
                        </tr>

                        <!-- Motivo -->
                        <tr>
                            <th style="background-color: #f8fafc;">
                                <i class="fas fa-notes-medical me-2 text-primary"></i>
                                Motivo
                            </th>

                            <td th:text="${consulta.motivo != null
                                and !#strings.isEmpty(consulta.motivo)
                                ? consulta.motivo
                                : '-'}">
                                -
                            </td>
                        </tr>

                        <!-- Diagnóstico -->
                        <tr>
                            <th style="background-color: #f8fafc;">
                                <i class="fas fa-stethoscope me-2 text-primary"></i>
                                Diagnóstico
                            </th>

                            <td th:text="${consulta.diagnostico != null
                                and !#strings.isEmpty(consulta.diagnostico)
                                ? consulta.diagnostico
                                : '-'}">
                                -
                            </td>
                        </tr>

                        <!-- Prescrição -->
                        <tr>
                            <th style="background-color: #f8fafc;">
                                <i class="fas fa-prescription me-2 text-primary"></i>
                                Prescrição
                            </th>

                            <td th:text="${consulta.prescricao != null
                                and !#strings.isEmpty(consulta.prescricao)
                                ? consulta.prescricao
                                : '-'}">
                                -
                            </td>
                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Botões -->
        <div class="mt-4 text-center">

            <!-- Voltar -->
            <a th:href="@{/web/consultas}"
               class="btn btn-secondary">

                <i class="fas fa-arrow-left me-1"></i>
                Voltar

            </a>

            <!-- Editar -->
            <a th:href="@{/web/consultas/{id}/editar(id=${consulta.id})}"
               class="btn btn-warning">

                <i class="fas fa-edit me-1"></i>
                Editar

            </a>

            <!-- Cancelar -->
            <form
                    th:if="${consulta.status == 'AGENDADA'}"
                    th:action="@{/web/consultas/{id}/cancelar(id=${consulta.id})}"
                    method="post"
                    style="display:inline;">

                <button type="submit"
                        class="btn btn-danger"
                        onclick="return confirm('Deseja realmente cancelar esta consulta?')">

                    <i class="fas fa-times me-1"></i>
                    Cancelar

                </button>

            </form>

            <!-- Finalizar -->
            <form
                    th:if="${consulta.status == 'AGENDADA'}"
                    th:action="@{/web/consultas/{id}/finalizar(id=${consulta.id})}"
                    method="post"
                    style="display:inline;">

                <button type="submit"
                        class="btn btn-success"
                        onclick="return confirm('Deseja realmente finalizar esta consulta?')">

                    <i class="fas fa-check me-1"></i>
                    Finalizar

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:replace="~{layout/base :: head}">
    <title th:text="${animal.id} ? 'Editar Animal' : 'Novo Animal'">ClyvoPet</title>
</head>
<body>
<div th:replace="~{layout/base :: layout(~{::page})}">
    <div th:fragment="page">

        <!-- Título centralizado -->
        <div class="text-center mb-3">
            <h1 class="page-title">
                <i class="fas fa-paw me-2" style="color: var(--primary);"></i>
                <span th:text="${animal.id} ? 'Editar Animal' : 'Novo Animal'"></span>
            </h1>
        </div>

        <div class="card">
            <div class="card-body">

                <form th:action="${animal.id}
                        ? @{/web/animais/{id}(id=${animal.id})}
                        : @{/web/animais}"
                      th:object="${animal}"
                      method="post"
                      class="needs-validation">

                    <!-- DADOS DO ANIMAL -->
                    <h5 class="form-section-title">
                        <i class="fas fa-paw me-2"
                           style="color: var(--primary);"></i>
                        Dados do Animal
                    </h5>

                    <div class="row g-3">

                        <!-- NOME -->
                        <div class="col-md-6">
                            <div class="form-group">

                                <label class="form-label">
                                    Nome
                                    <span class="text-danger">*</span>
                                </label>

                                <input type="text"
                                       th:field="*{nome}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                       placeholder="Digite o nome do animal"
                                       required>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('nome')}"
                                     th:errors="*{nome}">
                                </div>

                            </div>
                        </div>

                        <!-- ESPÉCIE -->
                        <div class="col-md-6">
                            <div class="form-group">

                                <label class="form-label">
                                    Espécie
                                    <span class="text-danger">*</span>
                                </label>

                                <input type="text"
                                       th:field="*{especie}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('especie')} ? 'is-invalid'"
                                       placeholder="Ex: Cachorro, Gato"
                                       required>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('especie')}"
                                     th:errors="*{especie}">
                                </div>

                            </div>
                        </div>

                        <!-- RAÇA -->
                        <div class="col-md-4">
                            <div class="form-group">

                                <label class="form-label">
                                    Raça
                                </label>

                                <input type="text"
                                       th:field="*{raca}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('raca')} ? 'is-invalid'"
                                       placeholder="Ex: Pastor Alemão">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('raca')}"
                                     th:errors="*{raca}">
                                </div>

                            </div>
                        </div>

                        <!-- IDADE -->
                        <div class="col-md-4">
                            <div class="form-group">

                                <label class="form-label">
                                    Idade
                                </label>

                                <input type="number"
                                       th:field="*{idade}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('idade')} ? 'is-invalid'"
                                       placeholder="Em anos"
                                       min="0">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('idade')}"
                                     th:errors="*{idade}">
                                </div>

                            </div>
                        </div>

                        <!-- PESO -->
                        <div class="col-md-4">
                            <div class="form-group">

                                <label class="form-label">
                                    Peso (kg)
                                </label>

                                <input type="number"
                                       step="0.1"
                                       th:field="*{peso}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('peso')} ? 'is-invalid'"
                                       placeholder="Ex: 10.5"
                                       min="0">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('peso')}"
                                     th:errors="*{peso}">
                                </div>

                            </div>
                        </div>

                        <!-- SEXO -->
                        <div class="col-md-6">
                            <div class="form-group">

                                <label class="form-label">
                                    Sexo
                                </label>

                                <select th:field="*{sexo}"
                                        class="form-select"
                                        th:classappend="${#fields.hasErrors('sexo')} ? 'is-invalid'">

                                    <option value="">
                                        Selecione
                                    </option>

                                    <option value="M">
                                        Macho
                                    </option>

                                    <option value="F">
                                        Fêmea
                                    </option>

                                </select>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('sexo')}"
                                     th:errors="*{sexo}">
                                </div>

                            </div>
                        </div>

                    </div>

                    <hr class="my-4">

                    <!-- DADOS DO TUTOR -->
                    <h5 class="form-section-title">
                        <i class="fas fa-user me-2"
                           style="color: var(--primary);"></i>
                        Dados do Tutor
                    </h5>

                    <div class="row g-3">

                        <!-- NOME DO TUTOR -->
                        <div class="col-md-6">
                            <div class="form-group">

                                <label class="form-label">
                                    Nome do Tutor
                                    <span class="text-danger">*</span>
                                </label>

                                <input type="text"
                                       th:field="*{tutorNome}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('tutorNome')} ? 'is-invalid'"
                                       placeholder="Digite o nome do tutor"
                                       required>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('tutorNome')}"
                                     th:errors="*{tutorNome}">
                                </div>

                            </div>
                        </div>

                        <!-- TELEFONE -->
                        <div class="col-md-6">
                            <div class="form-group">

                                <label class="form-label">
                                    Telefone
                                    <span class="text-danger">*</span>
                                </label>

                                <input type="text"
                                       th:field="*{tutorTelefone}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('tutorTelefone')} ? 'is-invalid'"
                                       placeholder="(11) 99999-9999"
                                       required>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('tutorTelefone')}"
                                     th:errors="*{tutorTelefone}">
                                </div>

                            </div>
                        </div>

                        <!-- E-MAIL -->
                        <div class="col-md-12">
                            <div class="form-group">

                                <label class="form-label">
                                    E-mail do Tutor
                                </label>

                                <input type="email"
                                       th:field="*{tutorEmail}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('tutorEmail')} ? 'is-invalid'"
                                       placeholder="tutor@email.com">

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('tutorEmail')}"
                                     th:errors="*{tutorEmail}">
                                </div>

                            </div>
                        </div>

                        <!-- OBSERVAÇÕES -->
                        <div class="col-md-12">
                            <div class="form-group">

                                <label class="form-label">
                                    Observações
                                </label>

                                <textarea th:field="*{observacoes}"
                                          class="form-control"
                                          th:classappend="${#fields.hasErrors('observacoes')} ? 'is-invalid'"
                                          rows="3"
                                          placeholder="Informações adicionais sobre o animal"></textarea>

                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('observacoes')}"
                                     th:errors="*{observacoes}">
                                </div>

                            </div>
                        </div>

                    </div>

                    <!-- BOTÕES -->
                    <div class="form-actions mt-4">

                        <button type="submit"
                                class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>
                            Salvar
                        </button>

                        <a th:href="@{/web/animais}"
                           class="btn btn-outline-secondary">
                            <i class="fas fa-times me-2"></i>
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>
</body>
</html>

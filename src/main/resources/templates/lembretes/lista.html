<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head th:replace="~{layout/base :: head}">
    <title>Lembretes - ClyvoPet</title>
</head>

<body>

<div th:replace="~{layout/base :: layout(~{::page})}">

    <div th:fragment="page">

        <!-- Título -->
        <div style="
            text-align: center !important;
            margin-bottom: 0.5rem !important;">

            <h1 style="
                font-size: 1.75rem;
                font-weight: 700;
                color: #1e293b;
                margin: 10px;">

                <i class="fas fa-bell me-2"
                   style="color: #1e3a8a;"></i>

                Lembretes

            </h1>

        </div>

        <!-- Cards de resumo -->
        <div style="
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;">

            <!-- Total -->
            <div class="card text-center"
                 style="flex: 0 0 30%; max-width: 150px;">

                <div class="card-body py-2">

                    <small class="text-muted">
                        Total
                    </small>

                    <div style="
                        font-size: 1.5rem;
                        font-weight: 700;
                        color: #1e3a8a;"

                         th:text="${#lists.size(lembretes)}">

                        0

                    </div>

                </div>

            </div>

            <!-- Enviados -->
            <div class="card text-center"
                 style="flex: 0 0 30%; max-width: 150px;">

                <div class="card-body py-2">

                    <small class="text-muted">
                        Enviados
                    </small>

                    <div style="
                        font-size: 1.5rem;
                        font-weight: 700;
                        color: #10b981;">

                        <span th:text="${#lists.size(lembretes) - #lists.size(pendentes)}">
                            0
                        </span>

                    </div>

                </div>

            </div>

            <!-- Pendentes -->
            <div class="card text-center"
                 style="flex: 0 0 30%; max-width: 150px;">

                <div class="card-body py-2">

                    <small class="text-muted">
                        Pendentes
                    </small>

                    <div style="
                        font-size: 1.5rem;
                        font-weight: 700;
                        color: #f59e0b;">

                        <span th:text="${#lists.size(pendentes)}">
                            0
                        </span>

                    </div>

                </div>

            </div>

        </div>

        <!-- Botões -->
        <div style="
            text-align: center !important;
            margin-bottom: 1.5rem !important;">

            <a th:href="@{/web/lembretes}"
               class="btn btn-outline-secondary btn-sm">

                Todos

            </a>

            <a th:href="@{/web/lembretes/pendentes}"
               class="btn btn-outline-warning btn-sm">

                Pendentes

            </a>

            <a th:href="@{/web/lembretes/enviar-todos}"
               class="btn btn-primary btn-sm">

                <i class="fas fa-envelope me-1"></i>

                Enviar Todos Pendentes

            </a>

        </div>

        <!-- Tabela -->
        <div class="table-responsive">

            <table class="table table-hover">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Animal</th>
                    <th>Tutor</th>
                    <th>E-mail</th>
                    <th>Data Envio</th>
                    <th class="text-center">
                        Status
                    </th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="l : ${lembretes}">

                    <!-- ID -->
                    <td data-label="ID"
                        th:text="${l.id}">
                    </td>

                    <!-- Animal -->
                    <td data-label="Animal"
                        th:text="${l.animalNome != null
                            ? l.animalNome
                            : '-'}">
                    </td>

                    <!-- Tutor -->
                    <td data-label="Tutor"
                        th:text="${l.tutorNome != null
                            ? l.tutorNome
                            : '-'}">
                    </td>

                    <!-- E-mail -->
                    <td data-label="E-mail"
                        th:text="${l.tutorEmail != null
                            ? l.tutorEmail
                            : '-'}">
                    </td>

                    <!-- Data -->
                    <td data-label="Data Envio">

                        <span
                                th:if="${l.dataEnvio != null}"

                                th:text="${#temporals.format(
                                l.dataEnvio,
                                'dd/MM/yyyy HH:mm'
                            )}">
                        </span>

                        <span th:unless="${l.dataEnvio != null}">
                            -
                        </span>

                    </td>

                    <!-- Status -->
                    <td data-label="Status"
                        class="text-center">

                        <span
                                th:class="${l.enviado}
                                ? 'badge bg-success'
                                : 'badge bg-warning'"

                                style="
                                font-size: 0.75rem;
                                padding: 0.3rem 0.7rem;">

                            <i
                                    th:class="${l.enviado}
                                    ? 'fas fa-check-circle'
                                    : 'fas fa-clock'"

                                    style="margin-right: 4px;">
                            </i>

                            <span
                                    th:text="${l.enviado}
                                    ? 'Enviado'
                                    : 'Pendente'">
                            </span>

                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <!-- Nenhum lembrete -->
        <div th:if="${#lists.isEmpty(lembretes)}"
             class="text-center py-5">

            <i class="fas fa-bell fa-3x mb-3"
               style="color: #94a3b8;">
            </i>

            <p class="text-muted">
                Nenhum lembrete cadastrado.
            </p>

            <p class="text-muted small">
                Os lembretes são gerados ao enviar
                um lembrete de consulta.
            </p>

        </div>

    </div>

</div>

</body>

</html>

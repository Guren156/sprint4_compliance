<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section})}">
<body>

<section>

    <div class="mb-4">

        <h2 th:text="${veterinario.id == null}
                ? 'Novo Veterinário'
                : 'Editar Veterinário'">
            Veterinário
        </h2>

        <p class="text-muted"
           th:text="${veterinario.id == null}
                ? 'Cadastre um novo veterinário no sistema.'
                : 'Atualize os dados do veterinário.'">
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:object="${veterinario}"
                  th:action="${veterinario.id == null}
                        ? @{/web/veterinarios}
                        : @{/web/veterinarios/{id}(id=${veterinario.id})}"
                  method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="nome"
                               class="form-label">
                            Nome
                        </label>

                        <input type="text"
                               id="nome"
                               th:field="*{nome}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('nome')}"
                             th:errors="*{nome}">
                        </div>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="email"
                               class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               th:readonly="${veterinario.id != null}"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="crmv"
                               class="form-label">
                            CRMV
                        </label>

                        <input type="text"
                               id="crmv"
                               th:field="*{crmv}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('crmv')} ? 'is-invalid'"
                               th:readonly="${veterinario.id != null}"
                               required>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('crmv')}"
                             th:errors="*{crmv}">
                        </div>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="telefone"
                               class="form-label">
                            Telefone
                        </label>

                        <input type="text"
                               id="telefone"
                               th:field="*{telefone}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('telefone')}"
                             th:errors="*{telefone}">
                        </div>

                    </div>

                </div>

                <div class="mb-3">

                    <label for="especialidade"
                           class="form-label">
                        Especialidade
                    </label>

                    <input type="text"
                           id="especialidade"
                           th:field="*{especialidade}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('especialidade')} ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('especialidade')}"
                         th:errors="*{especialidade}">
                    </div>

                </div>

                <div class="mb-3"
                     th:if="${veterinario.id == null}">

                    <label for="senha"
                           class="form-label">
                        Senha
                    </label>

                    <input type="password"
                           id="senha"
                           th:field="*{senha}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('senha')}"
                         th:errors="*{senha}">
                    </div>

                </div>

                <div class="d-flex justify-content-between">

                    <a th:href="@{/web/veterinarios}"
                       class="btn btn-outline-secondary">

                        <i class="fas fa-arrow-left me-1"></i>
                        Voltar

                    </a>

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="fas fa-save me-1"></i>

                        <span th:text="${veterinario.id == null}
                                ? 'Cadastrar'
                                : 'Salvar alterações'">
                            Salvar
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

</body>
</html>

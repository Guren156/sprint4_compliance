<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pt-br">

<head th:replace="~{layout/base :: head}">
    <title>Lista de Veterinários - ClyvoPet</title>
</head>

<body>

<div th:replace="~{layout/base :: layout(~{::page})}">
    <div th:fragment="page">

        <!-- Título centralizado -->
        <div style="text-align: center !important; margin-bottom: 0.5rem !important;">
            <h1 style="font-size: 1.75rem;
                       font-weight: 700;
                       color: #1e293b;
                       margin: 15px;">

                <i class="fas fa-user-doctor me-2"
                   style="color: #1e3a8a;"></i>

                Lista de Veterinários
            </h1>
        </div>

        <!-- Botão centralizado embaixo do título -->
        <div style="text-align: center !important;
                    margin-bottom: 1.5rem !important;">

            <a th:href="@{/web/veterinarios/novo}"
               class="btn btn-primary"
               style="display: inline-block;">

                <i class="fas fa-plus me-2"></i>
                Novo Veterinário
            </a>

        </div>

        <!-- Tabela -->
        <div class="table-responsive">

            <table class="table table-hover">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>CRMV</th>
                    <th>Telefone</th>
                    <th>Especialidade</th>
                    <th>Perfil</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="v : ${veterinarios}">

                    <td data-label="ID"
                        th:text="${v.id}">
                    </td>

                    <td data-label="Nome"
                        th:text="${v.nome}">
                    </td>

                    <td data-label="E-mail"
                        th:text="${v.email}">
                    </td>

                    <td data-label="CRMV"
                        th:text="${v.crmv}">
                    </td>

                    <td data-label="Telefone"
                        th:text="${v.telefone}">
                    </td>

                    <td data-label="Especialidade"
                        th:text="${v.especialidade}">
                    </td>

                    <td data-label="Perfil">

                        <span class="badge bg-danger"
                              th:if="${v.role == 'ADMIN'}">
                            ADMIN
                        </span>

                        <span class="badge bg-primary"
                              th:if="${v.role == 'VETERINARIO'}">
                            VETERINÁRIO
                        </span>

                    </td>

                    <td data-label="Ações"
                        class="text-center">

                        <div class="btn-group-actions">

                            <!-- Editar -->
                            <a th:href="@{/web/veterinarios/{id}/editar(id=${v.id})}"
                               class="btn btn-outline-warning btn-sm"
                               title="Editar">

                                <i class="fas fa-edit"></i>

                            </a>

                            <!-- Excluir -->
                            <form th:action="@{/web/veterinarios/{id}/delete(id=${v.id})}"
                                  method="post"
                                  style="display: inline;">

                                <button type="submit"
                                        class="btn btn-outline-danger btn-sm"
                                        title="Excluir"
                                        onclick="return confirm('Tem certeza que deseja excluir este veterinário? As consultas vinculadas serão canceladas.')">

                                    <i class="fas fa-trash"></i>

                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <!-- Caso não existam veterinários -->
        <div th:if="${veterinarios.empty}"
             class="text-center py-5">

            <i class="fas fa-user-doctor fa-3x mb-3"
               style="color: var(--gray-400);"></i>

            <p class="text-muted">
                Nenhum veterinário cadastrado.
            </p>

        </div>

    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head th:replace="~{layout/base :: head}">
    <title>Lista de Consultas - ClyvoPet</title>
</head>

<body>

<div th:replace="~{layout/base :: layout(~{::page})}">

    <div th:fragment="page">

        <!-- Título centralizado -->
        <div style="text-align: center !important; margin-bottom: 0.5rem !important;">
            <h1 style="font-size: 1.75rem; font-weight: 700; color: #1e293b; margin: 10px;">
                <i class="fas fa-calendar-check me-2"
                   style="color: #1e3a8a;"></i>
                Lista de Consultas
            </h1>
        </div>

        <!-- Botão centralizado -->
        <div style="text-align: center !important; margin-bottom: 1.5rem !important;">

            <a th:href="@{/web/consultas/nova}"
               class="btn btn-primary"
               style="display: inline-block;">

                <i class="fas fa-plus me-2"></i>
                Nova Consulta

            </a>

        </div>

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Animal</th>
                    <th>Veterinário</th>
                    <th>Data/Hora</th>
                    <th>Status</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="c : ${consultas}">

                    <td data-label="ID"
                        th:text="${c.id}">
                    </td>

                    <td data-label="Animal"
                        th:text="${c.animalNome != null ? c.animalNome : '-'}">
                    </td>

                    <td data-label="Veterinário"
                        th:text="${c.veterinarioNome != null ? c.veterinarioNome : '-'}">
                    </td>

                    <td data-label="Data/Hora"
                        th:text="${c.dataHora != null
                            ? #temporals.format(c.dataHora, 'dd/MM/yyyy HH:mm')
                            : '-'}">
                    </td>

                    <td data-label="Status">

                        <span
                                th:class="${c.status == 'AGENDADA'
                                ? 'badge bg-warning'
                                : c.status == 'REALIZADA'
                                    ? 'badge bg-success'
                                    : 'badge bg-danger'}"

                                style="font-size: 0.75rem;
                                   padding: 0.3rem 0.7rem;">

                            <i
                                    th:class="${c.status == 'AGENDADA'
                                    ? 'fas fa-clock'
                                    : c.status == 'REALIZADA'
                                        ? 'fas fa-check-circle'
                                        : 'fas fa-times-circle'}"

                                    style="margin-right: 4px;">
                            </i>

                            <span th:text="${c.status}"></span>

                        </span>

                    </td>

                    <td data-label="Ações"
                        class="text-center">

                        <div class="btn-group-actions">

                            <!-- Visualizar -->
                            <a th:href="@{/web/consultas/{id}(id=${c.id})}"
                               class="btn btn-outline-info btn-sm"
                               title="Visualizar">

                                <i class="fas fa-eye"></i>

                            </a>

                            <!-- Editar -->
                            <a th:href="@{/web/consultas/{id}/editar(id=${c.id})}"
                               class="btn btn-outline-warning btn-sm"
                               title="Editar">

                                <i class="fas fa-edit"></i>

                            </a>

                            <!-- Cancelar -->
                            <form
                                    th:if="${c.status == 'AGENDADA'}"
                                    th:action="@{/web/consultas/{id}/cancelar(id=${c.id})}"
                                    method="post"
                                    style="display:inline;">

                                <button type="submit"
                                        class="btn btn-outline-danger btn-sm"
                                        title="Cancelar"
                                        onclick="return confirm('Cancelar consulta?')">

                                    <i class="fas fa-times"></i>

                                </button>

                            </form>

                            <!-- Finalizar -->
                            <form
                                    th:if="${c.status == 'AGENDADA'}"
                                    th:action="@{/web/consultas/{id}/finalizar(id=${c.id})}"
                                    method="post"
                                    style="display:inline;">

                                <button type="submit"
                                        class="btn btn-outline-success btn-sm"
                                        title="Finalizar"
                                        onclick="return confirm('Finalizar consulta?')">

                                    <i class="fas fa-check"></i>

                                </button>

                            </form>

                            <!-- Lembrete -->
                            <a
                                    th:if="${c.status == 'AGENDADA'}"
                                    th:href="@{/web/lembretes/enviar/{id}(id=${c.id})}"
                                    class="btn btn-outline-primary btn-sm"
                                    title="Enviar Lembrete">

                                <i class="fas fa-bell"></i>

                            </a>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <!-- Lista vazia -->
        <div th:if="${#lists.isEmpty(consultas)}"
             class="text-center py-5">

            <i class="fas fa-calendar-check fa-3x mb-3"
               style="color: #94a3b8;">
            </i>

            <p class="text-muted">
                Nenhuma consulta agendada.
            </p>

        </div>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head th:replace="~{layout/base :: head}">
    <title>Lista de Animais - ClyvoPet</title>
</head>
<body>
<div th:replace="~{layout/base :: layout(~{::page})}">
    <div th:fragment="page">
        <!-- Título centralizado -->
        <div style="text-align: center !important; margin-bottom: 0.5rem !important;">
            <h1 style="font-size: 1.75rem; font-weight: 700; color: #1e293b; margin: 15px;">
                <i class="fas fa-paw me-2" style="color: #1e3a8a;"></i>Lista de Animais
            </h1>
        </div>

        <!-- Botão centralizado embaixo do título -->
        <div style="text-align: center !important; margin-bottom: 1.5rem !important;">
            <a href="/web/animais/novo" class="btn btn-primary" style="display: inline-block;">
                <i class="fas fa-plus me-2"></i>Novo Animal
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Espécie</th>
                    <th>Raça</th>
                    <th>Tutor</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${animais}">
                    <td data-label="ID" th:text="${a.id}"></td>
                    <td data-label="Nome" th:text="${a.nome}"></td>
                    <td data-label="Espécie" th:text="${a.especie}"></td>
                    <td data-label="Raça" th:text="${a.raca}"></td>
                    <td data-label="Tutor" th:text="${a.tutorNome}"></td>
                    <td data-label="Ações" class="text-center">
                        <div class="btn-group-actions">
                            <a th:href="@{/web/animais/{id}(id=${a.id})}" class="btn btn-outline-info btn-sm" title="Visualizar">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:href="@{/web/animais/{id}/editar(id=${a.id})}" class="btn btn-outline-warning btn-sm" title="Editar">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{/web/animais/{id}/delete(id=${a.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Desativar" onclick="return confirm('Tem certeza que deseja desativar esse registro?')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${animais.empty}" class="text-center py-5">
            <i class="fas fa-paw fa-3x mb-3" style="color: var(--gray-400);"></i>
            <p class="text-muted">Nenhum animal cadastrado.</p>
        </div>
    </div>
</div>
</body>
</html>
